<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        input, button {
            padding: 10px;
            margin: 6px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
        }

        li {
            margin: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Expense Tracker</h1>

    <input id="name" placeholder="Expense name">
    <input id="amount" type="number" min="0.01"
           step="0.01" placeholder="Amount">

    <button onclick="addExpense()">Add Expense</button>

    <h2>Your Expenses</h2>
    <ul id="expenses"></ul>

    <h3>Total: ₹<span id="total">0.00</span></h3>

    <button onclick="clearExpenses()">Clear All</button>
</div>

<script>
    let expenses = JSON.parse(
        localStorage.getItem("expenses") || "[]"
    );

    function displayExpenses() {
        const list = document.getElementById("expenses");
        list.replaceChildren();

        let total = 0;

        expenses.forEach((expense, index) => {
            const item = document.createElement("li");
            item.textContent =
                expense.name + " - ₹" + expense.amount.toFixed(2) + " ";

            const button = document.createElement("button");
            button.textContent = "Delete";
            button.onclick = function () {
                expenses.splice(index, 1);
                saveExpenses();
            };

            item.appendChild(button);
            list.appendChild(item);
            total += expense.amount;
        });

        document.getElementById("total").textContent =
            total.toFixed(2);
    }

    function addExpense() {
        const name = document.getElementById("name").value.trim();
        const amount = Number(
            document.getElementById("amount").value
        );

        if (!name || !Number.isFinite(amount) || amount <= 0) {
            alert("Enter a valid expense name and amount.");
            return;
        }

        expenses.push({ name: name, amount: amount });
        saveExpenses();

        document.getElementById("name").value = "";
        document.getElementById("amount").value = "";
    }

    function saveExpenses() {
        localStorage.setItem("expenses", JSON.stringify(expenses));
        displayExpenses();
    }

    function clearExpenses() {
        if (confirm("Delete all expenses?")) {
            expenses = [];
            saveExpenses();
        }
    }

    displayExpenses();
</script>
</body>
</html>
